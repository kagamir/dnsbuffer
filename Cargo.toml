[package]
name = "dnsbuffer"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
arc-swap = "1.9.2"
async-trait = "0.1.91"
axum = "0.8"
base64 = "0.22.1"
bytes = "1.12.1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.6.4", features = ["derive"] }
h3 = "0.0.8"
h3-quinn = "0.0.10"
hashlink = "0.12.1"
hickory-proto = "0.26.1"
http = "1.4.2"
http-body-util = "0.1.4"
humantime = "2.4.0"
hyper = { version = "1.11.0", features = ["client", "http1", "http2", "server"] }
hyper-util = { version = "0.1.20", features = ["tokio"] }
quinn = "0.11.11"
rand = "0.10.2"
rusqlite = { version = "0.37", features = ["bundled", "hooks"] }
rustls = "0.23.42"
rustls-pki-types = "1.15.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
thiserror = "2.0.19"
tokio = { version = "1.53.1", features = ["full"] }
tokio-rustls = "0.26.4"
toml = "1.1.3"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
webpki-roots = "1.0.9"

[dev-dependencies]
rcgen = "0.14.8"
tower = { version = "0.5", features = ["util"] }
