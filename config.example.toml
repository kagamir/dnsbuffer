[server]
listen = "0.0.0.0:53"
query_timeout_ms = 10000
upstream_timeout_ms = 5000       # 主上游阶段预算：失败或超时即切 fallback
prefer_ipv6 = false              # 拨号上游的地址族偏好；true 则 IPv6 优先（默认 IPv4 优先）
hedged_retry_ms = 1000           # 对冲式重试间隔：超时未返回即并行再发起尝试；0 禁用

[log]
level = "info"           # error | warn | info | debug | trace；RUST_LOG 环境变量优先
                         # warn 只看启动信息与配置问题；info 额外显示请求失败/重试

[dashboard]
listen = "0.0.0.0:8080"
database_path = "dnsbuffer.db"
retention_days = 7

[cache]
max_entries = 10000

[ecs]
# fixed_subnet = "203.0.113.0/24"   # 配置则注入该子网作为 ECS；不配置则不使用 ECS

[selector]
window = 32
k = 5.0

[adblock]
allowlist = ["allowed.example.com"]
block_response = "zero"

[[adblock.rule_source]]
url = "https://example.com/easylist.txt"
update_interval = "24h"

# [[adblock.rule_source]]
# path = "/etc/dnsbuffer/extra-rules.txt"

[[hosts]]
name = "router.local"
addrs = ["192.168.1.1"]

[[upstream]]
type = "doh"
url = "https://cloudflare-dns.com/dns-query"
http3 = true             # 默认 http/2；显式设 true 则仅用 http/3（严格按配置，不回退 H2）
# ech = ""            # 可选：静态 base64 ECHConfigList；留空则经 bootstrap HTTPS 记录动态获取
# ip = "104.16.248.249"  # 可选：该域名的 IP（仅一个，v4/v6 皆可）；留空经 bootstrap 解析

[[upstream]]
type = "dot"
ip = "9.9.9.9"
domain = "dns.quad9.net"     # 端口写在这里（如 "dns.quad9.net:8853"），默认 853

[[bootstrap.server]]
type = "plain"
addr = "1.1.1.1:53"

[[fallback]]
type = "plain"
addr = "8.8.8.8:53"
