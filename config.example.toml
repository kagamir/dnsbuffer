[server]
listen = "0.0.0.0:53"
query_timeout_ms = 10000
upstream_timeout_ms = 5000       # Budget for the primary upstream stage: on failure or timeout, switch to fallback
prefer_ipv6 = false              # Address-family preference when dialing upstreams; true prefers IPv6 (default prefers IPv4)
hedged_retry_ms = 1000           # Hedged retry interval: if no reply by this time, fire a parallel attempt; 0 disables

[log]
level = "info"           # error | warn | info | debug | trace; the RUST_LOG environment variable takes precedence
                         # warn shows only startup info and config issues; info additionally shows request failures/retries

[dashboard]
listen = "0.0.0.0:8080"       # No authentication; expose only to a trusted network, or use an authenticated reverse proxy
database_path = "data/dnsbuffer.db" # Relative paths are resolved against the process working directory; a failed init prevents the program from starting
retention_days = 7              # Allowed 0-9999; 0 keeps forever; 1-15 days trend by hour, 16+ days by day, 0 shows the last 30 daily buckets

[cache]
max_entries = 10000

[ecs]
# fixed_subnet = "203.0.113.0/24"   # If set, inject this subnet as ECS; if unset, ECS is not used

[selector]
window = 32
k = 5.0

[adblock]
allowlist = ["allowed.example.com"]
block_response = "zero"

[[adblock.rule_source]]
url = "https://example.com/easylist.txt"
update_interval = "24h"

# [[adblock.rule_source]]
# path = "/etc/dnsbuffer/extra-rules.txt"

[[hosts]]
name = "router.local"
addrs = ["192.168.1.1"]

[[upstream]]
type = "doh"
url = "https://cloudflare-dns.com/dns-query"
http3 = true             # Defaults to http/2; setting true explicitly uses http/3 only (strictly as configured, no fallback to H2)
# ech = ""            # Optional: a static base64 ECHConfigList; leave empty to fetch it dynamically via the bootstrap HTTPS record
# ip = "104.16.248.249"  # Optional: the IP for this domain (exactly one, v4 or v6); leave empty to resolve via bootstrap

[[upstream]]
type = "dot"
ip = "9.9.9.9"
domain = "dns.quad9.net"     # Put the port here (e.g. "dns.quad9.net:8853"); defaults to 853

[[bootstrap.server]]
type = "plain"
addr = "1.1.1.1:53"

[[fallback]]
type = "plain"
addr = "8.8.8.8:53"
