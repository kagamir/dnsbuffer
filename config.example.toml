[server]
listen = "0.0.0.0:53"
query_timeout_ms = 10000
upstream_timeout_ms = 5000       # 主上游阶段预算：失败或超时即切 fallback
prefer_ipv6 = false              # 拨号上游的地址族偏好；true 则 IPv6 优先（默认 IPv4 优先）

[cache]
max_entries = 10000

[ecs]
mode = "auto"            # auto | fixed | disabled
# fixed_subnet = "203.0.113.0/24"

[selector]
window = 32
k = 5.0

[adblock]
allowlist = ["allowed.example.com"]
block_response = "zero"

[[adblock.rule_source]]
url = "https://example.com/easylist.txt"
update_interval = "24h"

# [[adblock.rule_source]]
# path = "/etc/dnsbuffer/extra-rules.txt"

[[hosts]]
name = "router.local"
addrs = ["192.168.1.1"]

[[upstream]]
type = "doh"
url = "https://cloudflare-dns.com/dns-query"
http3 = true             # 默认 http/2；显式设 true 才启用 http/3（H3 优先、失败回退 H2）
# ech = ""            # 可选：静态 base64 ECHConfigList；留空则经 bootstrap HTTPS 记录动态获取
# ips = ["2606:4700::6810:f8f9", "104.16.248.249"]  # 可选：v4/v6 混填皆可，次序按 prefer_ipv6 整理；留空经 bootstrap 解析

[[upstream]]
type = "dot"
addr = "9.9.9.9:853"
domain = "dns.quad9.net"

[[bootstrap.server]]
type = "plain"
addr = "1.1.1.1:53"

[[fallback]]
type = "plain"
addr = "8.8.8.8:53"
