name: release

# Triggered when a GitHub Release is published: build binaries for
# linux/amd64 and linux/arm64 separately and attach them to the Release, while
# also building and pushing a multi-arch Docker image to GHCR.
# workflow_dispatch makes it easy to manually validate the pipeline (it does
# not upload Release assets, and the image is tagged with the branch name).
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write   # Upload Release assets
  packages: write   # Push images to GHCR

env:
  REGISTRY: ghcr.io

jobs:
  # ── Each architecture is compiled on its own native runner ──────────────
  # The target is musl static linking: the artifact does not depend on any
  # system libc, can be dropped straight into an alpine image, and also runs on
  # any Linux distribution (the build host's glibc version no longer affects
  # compatibility).
  build:
    name: build ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-musl
          - arch: arm64
            runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-musl
    steps:
      - uses: actions/checkout@v4

      # The aws-lc-rs build script needs a C compiler and cmake; musl-tools
      # provides musl-gcc (the musl cross-compilation wrapper for each runner's
      # native architecture)
      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake musl-tools

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}
        env:
          # cc/cmake build scripts (aws-lc-sys, etc.) use musl-gcc when cross-compiling for the musl target
          CC_x86_64_unknown_linux_musl: musl-gcc
          CC_aarch64_unknown_linux_musl: musl-gcc
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc

      - name: Resolve version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            echo "version=${{ github.event.release.tag_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Package binary tarball
        id: pkg
        run: |
          version="${{ steps.ver.outputs.version }}"
          pkg="dnsbuffer-${version}-${{ matrix.target }}"
          install -Dm755 "target/${{ matrix.target }}/release/dnsbuffer" "dist/${pkg}/dnsbuffer"
          cp config.example.toml README.md "dist/${pkg}/"
          tar -C dist -czf "${pkg}.tar.gz" "${pkg}"
          sha256sum "${pkg}.tar.gz" > "${pkg}.tar.gz.sha256"
          echo "tarball=${pkg}.tar.gz" >> "$GITHUB_OUTPUT"

      - name: Upload release assets
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.pkg.outputs.tarball }}
            ${{ steps.pkg.outputs.tarball }}.sha256

      # ── Docker: single-arch build on a native runner, pushed by digest (no QEMU needed) ──
      - name: Compute image name (lowercase)
        id: img
        run: echo "image=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Stage binary into Docker context
        run: cp "target/${{ matrix.target }}/release/dnsbuffer" ./dnsbuffer

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/${{ matrix.arch }}
          provenance: false
          outputs: type=image,name=${{ steps.img.outputs.image }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        run: |
          mkdir -p "${RUNNER_TEMP}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${RUNNER_TEMP}/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  # ── Merge the two single-arch digests into one multi-arch manifest list and tag it ──
  docker-manifest:
    name: merge multi-arch manifest
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Compute image name (lowercase)
        id: img
        run: echo "image=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker metadata (tags)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.img.outputs.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref_name, 'v0.') }}
            type=raw,value=latest,enable=${{ github.event_name == 'release' && !github.event.release.prerelease }}
            type=ref,event=branch

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push manifest list
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ steps.img.outputs.image }}@sha256:%s ' *)

      - name: Inspect
        run: docker buildx imagetools inspect "${{ steps.img.outputs.image }}:${{ steps.meta.outputs.version }}"
